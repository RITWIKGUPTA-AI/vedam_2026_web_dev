<!DOCTYPE html>
<html>
<head>
    <title>Simple Bowling Animation</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .lane {
            width: 300px;
            height: 400px;
            background-color: white;
            padding-top: 20px;
            text-align: center;
        }

        .pins {
            width: 30px;
            height: 50px;
            background-color: black;
            display: inline-block;
            border-radius: 15px;
        }
        .ball {
            width: 40px;
            height: 40px;
            background-color: black;
            border-radius: 50%;
            display: inline-block;
            animation-name: bowl;
            animation-duration: 1.5s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-timing-function: ease-in-out;
        }

        @keyframes bowl {
            0% {
                transform: translateY(300px);
            }
            25%{
                background-color: orange;
            }
            50%{
                background-color: yellow;
            }
            100% {
                transform: translateY(0px);
                background-color: red;
            }
        }
    </style>
</head>
<body>

    <div class="lane">
        <div class="pins"></div>
        <br>
        <div class="ball"></div>
    </div>

</body>
</html>
