<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            animation-name: bigbox-mover;
            animation-iteration-count: infinite;
            animation-duration: 5s;
            animation-direction: alternate;
        }

        .container {
            height: 500px;
            width: 500px;
            background-color: slategray;
        }

        .box {
            height: 100px;
            width: 100px;
            background-color: hotpink;
            /* link the animation */
            animation-name: box-mover;
            animation-duration: 5s;
            animation-iteration-count: infinite;
        /* after each iteration which direction your animation should  */
            /* if animation iteration is not inifinte -> where you want your animation to end */
            animation-fill-mode: forwards;
        /* speed of animation */
            
            animation-direction: alternate;
        }

        /* define the animation */
        @keyframes box-mover {
            20% {
                transform: translateX(400px);
            }

            50% {
                transform: translate(400px, 400px);
                border-radius: 50%;
            }

            75% {
                transform: translate(400px, 400px);
            }

            100% {
                background-color: red;
                transform: translateY(400px);


            }
        }
        @keyframes bigbox-mover {
            20% {
                transform: rotate(90deg);
            }

            50% {
                transform:rotate(180deg);
                border-radius: 50%;
            }

            75% {
                transform: rotate(270deg);
            }

            100% {
                transform: rotate(360deg);


            }

        }
    </style>
</head>

<body>


    <div class="container">
        <div class="box"></div>
    </div>


</body>

</html>
