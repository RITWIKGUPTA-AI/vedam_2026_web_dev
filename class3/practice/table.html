<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
        table{border: 2px solid burlywood;}

        td{border: 2px solid  red;}

<body><center>

        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>java</td>
                <td>web dev</td>
                <td>maths</td>
                <td>soft skills</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>maths</td>
                <td>web dev</td>
                <td>java</td>
                <td>soft skills</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>java</td>
                <td>soft skills</td>
                <td>maths</td>
                <td>web dev</td>
            </tr>
            <tr>
                <td>Thursday</td>
                <td>Soft skills</td>
                <td>maths</td>
                <td>web dev</td>
                <td>java</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>web dev</td>
                <td>java</td>
                <td>soft skills</td>
                <td>maths</td>
            </tr>
        </tbody>
    </table>
</body></center>
</html>
