<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .block,
    .inline,
    .inline_block {
        font-weight: bold;
        font-family: sans-serif;
    }


    /* template starts from here */
    .block {
        /* height, width, p,m,border */
        background-color: lightblue;
        display: block;
        padding: 10px;
        border: 2px solid red;
    }

    .inline {
        background-color: lightgreen;
        display: inline;
        border: 2px solid red;
        padding: 10px;
        margin: 2px;
        
    }

    .inline_block {
        background-color: mediumorchid;
        display: inline-block; 
        border: 2px solid red;
        padding: 5px;
        
        height: 10px;
    }
</style>

<body>
    <h2>Hello World</h2>
    <div class="block">Hello how are you</div>
    <div class="block">Hello how are you</div>
    <div class="inline">I am inline</div>
    <div class="inline">I am inline</div>
    <div class="inline_block">I am inline block</div>
    <div class="inline_block">I am inline block</div>
</body>

</html>
<!-- 

block:

1. next element -> new line

2. padding: apply in all directions

4. uwidth: works

5. margin :works

6. border: apply in all directions 
inline:

1. next element -> in same line

2. padding: apply in all directions

3. uheight: not works

4. uwidth: not works

5. margin: only works horizontally

6. border: apply in all directions 
inline-block:

1. next element -> in same line

2. padding: apply in all directions

4. uwidth: works
