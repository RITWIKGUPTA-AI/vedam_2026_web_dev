<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    :root{
        --primary:red;
        --primary-dark:green;
        --text:brown;
        --radius:9px;
        --fonts:sans-serif;
    }
    body{
        font-family: var(--fonts);
        color: var(--text);
        padding: var(--spacing);

    }
    button{
        background-color: var(--primary);
        color: white;
        border: navy;
        cursor: pointer;

    }button:hover{
        background-color: var(--primary-dark);
    }
    .card{
        border: 2px solid var(--primary);

    }




</style>
<body>
    <button>Click me</button>
    <div class="card">
        <h2>Card Title</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Debitis voluptas est accusantium provident. Quaerat nam et iusto libero molestiae a.</p>


    </div>
    
</body>
</html>
